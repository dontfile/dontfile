# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    # Migrations from the Rails 5 and 6 era keep their original style.
    - "db/migrate/2018*"
    - "db/migrate/2019*"
    - "db/migrate/2020*"
